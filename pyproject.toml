[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "birdsong-detect-distill"
version = "0.1.0"
description = "Distill Qwen spectrogram annotations into frozen SongMAE detectors."
requires-python = ">=3.10"
dependencies = [
  "librosa>=0.10",
  "matplotlib>=3.8",
  "numpy>=1.24",
  "pandas>=2",
  "pillow>=10",
  "requests>=2",
  "safetensors>=0.3",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "soundfile>=0.12",
  "torch>=2.1",
  "transformers>=4.36,<5",
  "ultralytics>=8.3",
]

[tool.setuptools.packages.find]
where = ["src"]
